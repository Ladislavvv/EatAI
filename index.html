<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EatAI — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00bc7d; --green-deep:#00a06a;
  --navy:#131b2b;
  --amber1:#ffb901; --amber2:#d38211;
  --screen-bg:#ececec; --card:#ffffff;
  --ink:rgba(0,0,0,.85); --ink-7:rgba(0,0,0,.7); --ink-4:rgba(0,0,0,.4);
  --muted:#919191;
  --p-bg:#eafdf3; --f-bg:#fffae7; --c-bg:#edf5fe;
  --p-bar:#d1f9e1; --f-bar:#ffecb5; --c-bar:#daebfc;
  --p-dot:#a8d5b5; --f-dot:#f5e28a; --c-dot:#a8d4f5;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:#1a1a1a;
  color:#fff;
  overflow:hidden;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}

/* ---------- page shell ---------- */
#fit-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#stage{transform-origin:center center;}
.page-head{text-align:center;margin-bottom:34px;}
.page-head h1{font-size:24px;font-weight:600;letter-spacing:-.02em;color:#f4f4f4;}
.page-head p{font-size:14px;font-weight:400;color:#8a8a8a;margin-top:7px;letter-spacing:-.01em;}
.devices{display:flex;align-items:flex-start;gap:90px;}
.device-col{display:flex;flex-direction:column;align-items:center;gap:20px;}
.device-cap{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#7c7c7c;}

/* ---------- device chassis ---------- */
.chassis{position:relative;background:linear-gradient(150deg,#2b2b2e,#161617 55%,#242427);box-shadow:0 40px 90px -20px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.06);}
.phone{padding:13px;border-radius:60px;}
.phone .screen-clip{width:393px;height:852px;border-radius:47px;}
.tablet{padding:18px;border-radius:42px;}
.tablet .screen-clip{width:768px;height:1024px;border-radius:26px;}
.screen-clip{position:relative;overflow:hidden;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);}
/* side buttons */
.btn-side{position:absolute;background:linear-gradient(#3a3a3d,#202022);border-radius:3px;}
.phone .b-power{right:-3px;top:208px;width:4px;height:96px;border-radius:0 3px 3px 0;}
.phone .b-volup{left:-3px;top:168px;width:4px;height:56px;border-radius:3px 0 0 3px;}
.phone .b-voldn{left:-3px;top:236px;width:4px;height:56px;border-radius:3px 0 0 3px;}
.phone .b-silent{left:-3px;top:118px;width:4px;height:32px;border-radius:3px 0 0 3px;}
.tablet .b-power{top:-3px;right:120px;height:4px;width:70px;border-radius:3px 3px 0 0;}
.tablet .b-vol{left:-3px;top:90px;width:4px;height:120px;border-radius:3px 0 0 3px;}

/* ---------- app ---------- */
.app{position:absolute;inset:0;background:var(--screen-bg);font-family:var(--font);overflow:hidden;}
.screen{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .28s ease;}
.screen.active{opacity:1;pointer-events:auto;}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;flex-direction:column;gap:13px;padding-bottom:150px;}
.scroll::-webkit-scrollbar{display:none;}

/* status bar */
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 34px;color:#000;pointer-events:none;}
.tablet .statusbar{padding:0 44px;height:46px;}
.sb-time{font-size:16px;font-weight:600;letter-spacing:-.01em;padding-top:8px;}
.tablet .sb-time{padding-top:0;}
.sb-right{display:flex;align-items:center;gap:7px;padding-top:8px;}
.tablet .sb-right{padding-top:0;}
.sb-right svg{display:block;}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;background:#000;border-radius:20px;z-index:41;}
.tablet .island{display:none;}
.tablet-cam{display:none;position:absolute;top:9px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#0a0a0a;box-shadow:inset 0 0 0 2px #1d1d1f;z-index:41;}
.tablet .tablet-cam{display:block;}
.app[data-screen="camera"] .statusbar{color:#fff;}

/* home indicator */
.home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:rgba(0,0,0,.85);z-index:40;}
.tablet .home-ind{width:200px;}
.app[data-screen="camera"] .home-ind{background:#fff;}

/* ===== shared building blocks ===== */
/* cards bleed full-width to screen edges (Figma) */
.card{background:var(--card);border-radius:32px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:26px 20px;flex:none;}

.screen-title{font-size:24px;font-weight:500;letter-spacing:-.04em;color:var(--ink-4);text-align:center;}

/* header white card (rounded bottom), full width */
.head-card{background:var(--card);border-radius:0 0 32px 32px;padding:90px 20px 34px;display:flex;flex-direction:column;align-items:center;gap:30px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.is-tablet .head-card{padding-top:74px;}
.head-home{padding:130px 20px 52px;gap:42px;}
.is-tablet .head-home{padding-top:116px;}

/* big calorie number */
.kcal-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
.kcal-num{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1;color:#000;font-variant-numeric:tabular-nums;}
.kcal-sub{font-size:20px;font-weight:500;letter-spacing:-.04em;color:var(--ink-4);}

.prog-wrap{width:100%;}
.is-tablet .prog-wrap{width:473px;}
.progress{position:relative;width:100%;height:16px;border-radius:16px;background:#f3f4f6;overflow:hidden;}
.progress > i{position:absolute;left:0;top:0;height:100%;border-radius:16px;background:linear-gradient(90deg,var(--amber1),rgba(211,130,17,.85));}
.goal-row{display:flex;justify-content:space-between;width:100%;margin-top:10px;font-size:12px;font-weight:500;letter-spacing:-.02em;color:var(--ink-4);}

/* macro big cards */
.macro-row{display:flex;gap:18px;justify-content:center;}
.macro-card{width:104px;height:125px;border-radius:20px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.macro-card .v{font-family:"Inter",var(--font);font-size:30px;font-weight:400;line-height:1;color:rgba(0,0,0,.72);}
.macro-card .l{font-family:"Inter",var(--font);font-size:14px;font-weight:500;color:var(--muted);}
.m-p{background:var(--p-bg);} .m-f{background:var(--f-bg);} .m-c{background:var(--c-bg);}
.app:not(.is-tablet) .macro-wrap{height:206px;display:flex;flex-direction:column;justify-content:center;}

/* BJU stat card */
.bju-head{display:flex;justify-content:space-between;align-items:center;}
.bju-title{font-family:"Inter",var(--font);font-size:16px;font-weight:500;color:var(--ink-7);}
.legend{display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
.is-tablet .legend{flex-direction:row;gap:16px;align-items:center;}
.legend .li{display:flex;align-items:center;gap:7px;font-family:"Inter",var(--font);font-size:13px;color:var(--ink-7);}
.legend .dot{width:11px;height:11px;border-radius:3px;}

/* phone: horizontal day bars */
.bars-v{display:flex;flex-direction:column;gap:11px;margin-top:18px;}
.bar-row{display:flex;align-items:center;gap:12px;}
.bar-day{width:26px;font-family:"Inter",var(--font);font-size:14px;color:var(--ink-7);}
.bar-track{flex:1;height:30px;border-radius:8px;overflow:hidden;display:flex;}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-family:"Inter",var(--font);font-size:12px;color:rgba(0,0,0,.55);}
.seg.p{background:var(--p-bar);} .seg.f{background:var(--f-bar);} .seg.c{background:var(--c-bar);}

/* tablet: vertical day columns */
.bars-h{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;padding:0 30px;}
.col{display:flex;flex-direction:column;align-items:center;gap:12px;}
.col-track{width:62px;height:180px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:#e9e9e9;}
.col-track .seg{width:100%;font-size:12px;}
.col-day{font-family:"Inter",var(--font);font-size:14px;color:var(--ink-7);}

/* bottom nav */
.tabbar{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:18px;padding:6px;border-radius:56px;background:rgba(255,255,255,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 8px 26px rgba(0,0,0,.14);z-index:30;}
.tabbar.solo{gap:0;}
.navbtn{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#374957;transition:background .2s,color .2s;}
.navbtn svg{width:27px;height:27px;display:block;}
.navbtn.active{background:#fff;color:var(--green);box-shadow:0 3px 10px rgba(0,0,0,.1);}
.navbtn:active{transform:scale(.92);}

/* ===== camera ===== */
.cam{position:absolute;inset:0;background:#000;}
.cam-photo{position:absolute;inset:0;background:url("assets/food-salad.png") center/cover no-repeat;opacity:0;transition:opacity .4s ease;}
.app .cam.has-photo .cam-photo{opacity:1;}
.cam-hint{position:absolute;top:62px;left:0;right:0;text-align:center;font-size:24px;font-weight:500;letter-spacing:-.04em;color:rgba(255,255,255,.45);}
.app .cam.has-photo .cam-hint{opacity:0;}
.viewfinder{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:300px;height:300px;color:rgba(255,255,255,.85);cursor:pointer;}
.is-tablet .viewfinder{width:430px;height:430px;}
.viewfinder svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.cam-controls{position:absolute;left:0;right:0;bottom:54px;display:flex;justify-content:center;align-items:center;gap:30px;z-index:30;}
.cam-btn{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;color:#fff;}
.cam-btn svg{width:28px;height:28px;}
.cam-btn:active{transform:scale(.92);}
.shutter{width:78px;height:78px;border-radius:50%;background:transparent;border:4px solid #fff;display:flex;align-items:center;justify-content:center;}
.shutter > i{width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .12s;}
.shutter:active > i{transform:scale(.86);}

/* ===== analysis ===== */
.an-center{display:flex;flex-direction:column;align-items:center;}
.an-badge{width:172px;height:84px;border-radius:100px;background:rgba(19,27,43,.92);box-shadow:1px 6px 18px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;}
.an-badge span{font-size:60px;font-weight:300;letter-spacing:-.04em;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
.an-sub{font-size:16px;letter-spacing:-.04em;color:var(--ink-4);margin-top:12px;text-align:center;}
.pills{display:flex;gap:12px;justify-content:center;margin-top:24px;}
.pill{width:108px;height:74px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
.pill .v{font-family:"Inter",var(--font);font-size:28px;color:rgba(0,0,0,.72);line-height:1;}
.pill .l{font-family:"Inter",var(--font);font-size:13px;font-weight:500;color:var(--muted);}

.ing-list{display:flex;flex-direction:column;gap:10px;flex:none;}
.ing{display:flex;align-items:center;gap:16px;background:#fff;border-radius:30px;padding:18px 24px 18px 16px;min-height:92px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.ing-thumb{width:60px;height:60px;border-radius:18px;flex:none;background-image:url("assets/food-salad.png");background-size:230px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
/* ingredient image only on tablet */
.app:not(.is-tablet) .ing-thumb{display:none;}
.is-tablet .ing{min-height:148px;padding:24px 28px 24px 24px;}
.is-tablet .ing-thumb{width:150px;height:100px;border-radius:18px;}
.ing-info{flex:1;min-width:0;}
.ing-name{font-size:20px;font-weight:500;letter-spacing:-.03em;color:var(--ink-7);}
.app:not(.is-tablet) .ing-name{font-size:16px;}
.ing-g{font-size:13px;letter-spacing:-.03em;color:var(--ink-4);margin-top:4px;}
.ing-edit{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-4);flex:none;}
.ing-edit svg{width:18px;height:18px;}
.ing-edit:active{background:rgba(0,0,0,.05);}

/* analysis action buttons */
.an-actions{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);display:flex;gap:12px;padding:6px;border-radius:56px;background:rgba(217,217,217,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:30;}
.btn{height:48px;border-radius:21px;font-size:16px;font-weight:500;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;padding:0 30px;transition:transform .12s,filter .2s;min-width:150px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green);color:#fff;box-shadow:inset 0 0 0 99px rgba(0,0,0,.06);}
.btn-primary:hover{filter:brightness(1.04);}
.btn-secondary{background:#fff;color:var(--ink-7);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}

/* edit modal */
.modal-back{position:absolute;inset:0;background:rgba(12,11,20,.34);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);opacity:0;pointer-events:none;transition:opacity .26s;z-index:50;}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:32px 32px 0 0;padding:32px 20px calc(34px + 20px);transform:translateY(100%);opacity:0;visibility:hidden;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .2s,visibility .32s;}
.is-tablet .sheet{padding:36px 28px calc(34px + 24px);}
.app[data-modal="1"] .modal-back{opacity:1;pointer-events:auto;}
.app[data-modal="1"] .sheet{transform:translateY(0);opacity:1;visibility:visible;}
.sheet h3{font-family:"Inter",var(--font);font-size:20px;font-weight:500;color:var(--ink-7);margin-bottom:22px;}
.field{margin-bottom:18px;}
.field label{display:block;font-family:"Inter",var(--font);font-size:16px;color:var(--ink-7);margin-bottom:10px;}
.field input{width:100%;height:46px;border-radius:21px;background:#f9fafb;border:1px solid #e5e7eb;padding:0 16px;font-family:var(--font);font-size:16px;font-weight:500;letter-spacing:-.02em;color:var(--ink-7);outline:none;}
.field input:focus{border-color:var(--green);}
.sheet-actions{display:flex;gap:10px;margin-top:26px;}
.sheet-actions .btn{flex:1;min-width:0;}

/* profile */
.prof-sections{display:flex;flex-direction:column;gap:13px;}
.prof-card{background:#fff;border-radius:32px;padding:28px 24px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.prof-card .ttl{font-size:20px;font-weight:500;letter-spacing:-.04em;color:var(--ink-4);margin-bottom:20px;}
.prof-row{display:flex;justify-content:space-between;align-items:center;font-family:"Inter",var(--font);font-size:16px;color:var(--ink-7);padding:7px 0;}
.prof-row .k{color:var(--ink-7);} 
.prof-row .val{font-weight:500;color:var(--ink-7);}
</style>
</head>

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#1a1a1a"/>
    <rect x="36" y="22" width="28" height="56" rx="7" fill="#ececec" stroke="#00bc7d" stroke-width="2"/>
    <circle cx="50" cy="44" r="9" fill="none" stroke="#00bc7d" stroke-width="2.5"/>
    <circle cx="50" cy="44" r="3" fill="#00bc7d"/>
  </svg>
</template>
<div id="fit-wrap">
  <div id="stage">
    <div class="devices" id="devices"></div>
  </div>
</div>

/* ---------------- data ---------------- */
const DAYS = [
  {d:'Пн', p:25, f:20, c:55},
  {d:'Вт', p:28, f:22, c:50},
  {d:'Ср', p:30, f:18, c:52},
  {d:'Чт', p:22, f:25, c:53},
  {d:'Пт', p:27, f:20, c:53},
  {d:'Сб', p:35, f:15, c:50},
  {d:'Вс', p:26, f:21, c:53},
];
const INGREDIENTS = [
  {name:'Куриная грудка', g:180, pos:'52% 64%', size:'210px'},
  {name:'Листья салата романо', g:40, pos:'34% 46%', size:'190px'},
  {name:'Помидоры черри', g:20, pos:'82% 50%', size:'170px'},
];

/* ---------------- markup builders ---------------- */
function statusbar(){
  return `<div class="island"></div><div class="tablet-cam"></div>
  <div class="statusbar">
    <div class="sb-time">9:41</div>
    <div class="sb-right">${ICON.signal}${ICON.wifi}${ICON.battery}</div>
  </div>`;
}
function nav(active){
  const b=(name,ic,act)=>`<button class="navbtn ${act?'active':''}" data-act="${name}">${ICON[ic]}</button>`;
  return `<div class="tabbar">
    ${b('home','home',active==='home')}
    ${b('camera','camera',false)}
    ${b('profile','user',active==='profile')}
  </div>`;
}

function homeScreen(){
  return `<div class="screen" data-screen="home">
    <div class="scroll">
      <div class="head-card head-home">
        <div class="kcal-wrap">
          <div class="kcal-num">1&nbsp;847</div>
          <div class="kcal-sub">результат сегодня</div>
        </div>
        <div class="prog-wrap">
          <div class="progress"><i style="width:77%"></i></div>
        </div>
      </div>

      <div class="card macro-wrap">
        <div class="macro-row">
          <div class="macro-card m-p"><div class="v">92</div><div class="l">Белки</div></div>
          <div class="macro-card m-f"><div class="v">67</div><div class="l">Жиры</div></div>
          <div class="macro-card m-c"><div class="v">189</div><div class="l">Углеводы</div></div>
        </div>
      </div>

      <div class="card bju-card">
        <div class="bju-head">

          <div class="legend">

            <div class="li"><span class="dot" style="background:var(--f-dot)"></span>Жиры</div>
            <div class="li"><span class="dot" style="background:var(--c-dot)"></span>Углеводы</div>
          </div>
        </div>
        <div class="bars-slot"></div>
      </div>
    </div>
    ${nav('home')}
  </div>`;
}

function cameraScreen(){
  return `<div class="screen" data-screen="camera">
    <div class="cam">
      <div class="cam-photo"></div>
      <div class="cam-hint">сделайте фото еды</div>
      <div class="viewfinder" data-act="shutter">${ICON.viewfinder}</div>
      <div class="cam-controls">
        <button class="cam-btn" data-act="home">${ICON.home}</button>
        <button class="shutter" data-act="shutter"><i></i></button>

function analysisScreen(){
  const pill=(v,l,c)=>`<div class="pill m-${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const ing=(it,i)=>`<div class="ing">
      <div class="ing-thumb" style="background-position:${it.pos};background-size:${it.size}"></div>
      <div class="ing-info"><div class="ing-name">${it.name}</div><div class="ing-g">${it.g} грамм</div></div>

            ${pill(92,'Белки','p')}${pill(67,'Жиры','f')}${pill(148,'Углеводы','c')}
          </div>
        </div>
      </div>

      <div class="ing-list">${INGREDIENTS.map(ing).join('')}</div>
    </div>

    <div class="an-actions">
      <button class="btn btn-secondary" data-act="retake">Переснять</button>

    <div class="modal-back" data-act="close-modal"></div>
    <div class="sheet">
      <h3>редактирование</h3>
      <div class="field"><label>Название блюда</label><input type="text" data-field="name"></div>
      <div class="field"><label>Вес (граммы)</label><input type="text" inputmode="numeric" data-field="g"></div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" data-act="close-modal">Отмена</button>
        <button class="btn btn-primary" data-act="save-modal">Сохранить</button>

}

function profileScreen(){
  const card=(t,rows)=>`<div class="prof-card"><div class="ttl">${t}</div>
    ${rows.map(r=>`<div class="prof-row"><span class="k">${r[0]}</span><span class="val">${r[1]}</span></div>`).join('')}
  </div>`;

    <div class="scroll">
      <div class="head-card"><div class="screen-title">профиль</div></div>
      ${card('данные',[['Имя','Vladislav'],['Email','example@example.com']])}
      ${card('параметры тела',[['Вес','81 кг'],['Рост','181 см']])}
      ${card('другое',[['Режим','Сбалансированный'],['Целевой вес','75 кг']])}
    </div>
    <div class="tabbar solo"><button class="navbtn active" data-act="home">${ICON.home}</button></div>
  </div>`;
}

/* ---------------- app instance ---------------- */
function buildApp(isTablet){
  const app=document.createElement('div');
  app.className='app'+(isTablet?' is-tablet':'');
  app.innerHTML = statusbar()
    + homeScreen() + cameraScreen() + analysisScreen() + profileScreen()
    + '<div class="home-ind"></div>';

  // inject the correct BJU chart variant
  const barsSlot = app.querySelector('.bars-slot');
  const homeSc = app.querySelector('[data-screen="home"]');
  // rebuild bars for this form factor
  const seg=(d)=>`<div class="bar-track"><div class="seg p" style="width:${d.p}%">${d.p}%</div><div class="seg f" style="width:${d.f}%">${d.f}%</div><div class="seg c" style="width:${d.c}%">${d.c}%</div></div>`;
  const col=(d)=>`<div class="col"><div class="col-track"><div class="seg p" style="height:${d.p}%">${d.p}%</div><div class="seg f" style="height:${d.f}%">${d.f}%</div><div class="seg c" style="height:${d.c}%">${d.c}%</div></div><div class="col-day">${d.d}</div></div>`;
  if(isTablet){
    barsSlot.outerHTML = `<div class="bars-h">${DAYS.map(col).join('')}</div>`;
  } else {
    barsSlot.outerHTML = `<div class="bars-v">${DAYS.map(d=>`<div class="bar-row"><div class="bar-day">${d.d}</div>${seg(d)}</div>`).join('')}</div>`;
  }

  // state
  const state={screen:'home',hasPhoto:false,modal:false,editing:0};
  function show(name){
    state.screen=name;
    app.setAttribute('data-screen',name);
    app.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.dataset.screen===name));
  }
  function openModal(i){
    state.editing=i;state.modal=true;
    const ni=app.querySelector('[data-field="name"]'), gi=app.querySelector('[data-field="g"]');
    ni.value=INGREDIENTS[i].name; ni.setAttribute('value',INGREDIENTS[i].name);
    gi.value=INGREDIENTS[i].g; gi.setAttribute('value',INGREDIENTS[i].g);
    app.setAttribute('data-modal','1');
  }
  function closeModal(){state.modal=false;app.removeAttribute('data-modal');}

  const cam=app.querySelector('.cam');

  app.addEventListener('click',(e)=>{
    const t=e.target.closest('[data-act]');
    if(!t) return;
    const act=t.dataset.act;
    switch(act){
      case 'home': cam.classList.remove('has-photo'); closeModal(); show('home'); break;
      case 'profile': show('profile'); break;
      case 'camera': cam.classList.remove('has-photo'); show('camera'); break;
      case 'shutter':
        if(!cam.classList.contains('has-photo')){ cam.classList.add('has-photo'); }
        else { closeModal(); show('analysis'); }
        break;
      case 'retake': cam.classList.remove('has-photo'); show('camera'); break;
      case 'save': closeModal(); cam.classList.remove('has-photo'); show('home'); break;
      case 'edit': openModal(parseInt(t.dataset.ing,10)); break;
      case 'close-modal':
      case 'save-modal': closeModal(); break;
    }
  });

  show('home');
  return app;
}

/* ---------------- mount ---------------- */
function deviceCol(label,chassisClass,app){
  const col=document.createElement('div');
  col.className='device-col';
  col.innerHTML=`<div class="device-cap">${label}</div>
    <div class="chassis ${chassisClass}">
      ${chassisClass==='phone'
        ? '<div class="btn-side b-silent"></div><div class="btn-side b-volup"></div><div class="btn-side b-voldn"></div><div class="btn-side b-power"></div>'
        : '<div class="btn-side b-power"></div><div class="btn-side b-vol"></div>'}
      <div class="screen-clip"></div>
    </div>`;
  col.querySelector('.screen-clip').appendChild(app);
  return col;
}
const devices=document.getElementById('devices');
devices.appendChild(deviceCol('Смартфон','phone',buildApp(false)));
devices.appendChild(deviceCol('Планшет','tablet',buildApp(true)));

/* ---------------- scale to fit ---------------- */
const stage=document.getElementById('stage');
function fit(){
  stage.style.transform='scale(1)';
  const r=stage.getBoundingClientRect();
  const margin=48;
  const sw=(window.innerWidth-margin)/r.width;
  const sh=(window.innerHeight-margin)/r.height;
  const s=Math.min(1,sw,sh);
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
fit();
setTimeout(fit,300);
</script>
